name = "isitslop-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `wrangler secret put <NAME>`):
#   DATABASE_URL          Neon Postgres connection string
#   ADMIN_TOKEN           bearer token for resolving appeals
#   AWS_ACCESS_KEY_ID     SES-only IAM user (optional; email verification disabled without it)
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   SES_FROM              e.g. verify@isitslop.org

[vars]
PUBLIC_SITE_URL = "https://isitslop.org"

[observability]
enabled = true

# Custom domain. Requires the isitslop.org zone to be on the same Cloudflare account.
# Until then the Worker is reachable on its workers.dev URL.
# routes = [{ pattern = "api.isitslop.org", custom_domain = true }]
