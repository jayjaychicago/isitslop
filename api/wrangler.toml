name = "isitslop-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets (set with `wrangler secret put <NAME>`):
#   DATABASE_URL          Neon Postgres connection string
#   ADMIN_TOKEN           bearer token for resolving appeals
#   API_KEY               single fixed key for GET /v1/score (Authorization: Bearer or x-api-key)
#   AWS_ACCESS_KEY_ID     SES-only IAM user (optional; email verification disabled without it)
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   SES_FROM              e.g. verify@isitslop.org
#   GITHUB_APP_CLIENT_ID  the isitslop GitHub App; owners connect their account and we read repos with their token
#   GITHUB_APP_CLIENT_SECRET
#   GITHUB_APP_SLUG       for the install link, https://github.com/apps/<slug>
#   TOKEN_KEY             64 hex chars; encrypts stored GitHub tokens and signs OAuth state
#   GITHUB_TOKEN          optional fallback for anonymous /v1/preview only
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET  OAuth client for "Connect Google Analytics" (scope analytics.readonly)

# Custom domains (the isitslop.org zone is on the same Cloudflare account).
# internalapi is what the website and the operator's proxy call. api stays only until the GitHub and Google
# OAuth registrations are moved to internalapi (see OAUTH_CALLBACK_ORIGIN), then it can go.
routes = [
  { pattern = "internalapi.isitslop.org", custom_domain = true },
  { pattern = "api.isitslop.org", custom_domain = true },
]

[vars]
PUBLIC_SITE_URL = "https://isitslop.org"
# Origin registered as the OAuth callback with GitHub and Google. Change both registrations before changing this.
OAUTH_CALLBACK_ORIGIN = "https://api.isitslop.org"
# GitHub logins that can delete any entry from the site (comma separated). The operator.
ADMIN_GITHUB_LOGINS = "jayjaychicago"

[triggers]
# Daily at 04:10 UTC: popularity for every graded entry; on the 1st of the month, quality too.
crons = ["10 4 * * *"]

[observability]
enabled = true
