# Deploys the Worker on every push to main that touches api/.
# Needs repo secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit).
name: deploy-api
on:
  push:
    branches: [main]
    paths: [api/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy
        env: { CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} }
